plugins { id 'com.android.application' }
android {
    namespace 'com.example.neetscoretracker'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'com.example.neetscoretracker'
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName '3.0'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { cppFlags '-std=c++17 -O3' } }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
}
