name: Download and self-host AIIMS campus photos

on:
  push:
    branches:
      - the-last-mile
    paths:
      - .github/workflows/vendor-aiims-photos.yml
      - .github/scripts/vendor_aiims_photos.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor-campus-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          ref: the-last-mile
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tools
        run: python -m pip install --disable-pip-version-check requests pillow

      - name: Download AIIMS photos and update site references
        run: python .github/scripts/vendor_aiims_photos.py

      - name: Commit local campus images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/campuses assets/app.js index.html sw.js
          if git diff --cached --quiet; then
            echo "No downloaded images or site changes to commit."
          else
            git commit -m "Self-host AIIMS campus gallery photos"
            git push origin HEAD:the-last-mile
          fi
