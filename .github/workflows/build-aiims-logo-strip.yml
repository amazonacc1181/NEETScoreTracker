name: Build and publish AIIMS logo marquee

on:
  push:
    branches:
      - the-last-mile
    paths:
      - .github/scripts/build_aiims_logo_strip.py
      - .github/workflows/build-aiims-logo-strip.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  logos:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          ref: the-last-mile
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install logo processing tools
        run: python -m pip install --disable-pip-version-check requests pillow beautifulsoup4

      - name: Download institute logo marks and build marquee
        run: python .github/scripts/build_aiims_logo_strip.py

      - name: Commit local logos and homepage changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/aiims-logos assets/app.js index.html sw.js
          if git diff --cached --quiet; then
            echo "No logo assets or homepage changes were needed."
          else
            git commit -m "Add locally hosted AIIMS institute logo marquee"
            git push origin HEAD:the-last-mile
          fi
