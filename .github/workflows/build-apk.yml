name: Build NEET IQ AI 3.0 APK
on:
  workflow_dispatch:
  push:
    branches: [ main, feature/neet-iq-ai-3.0 ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK and CMake
        run: sdkmanager "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-35"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate fine-tuning data pipeline
        run: |
          python -m py_compile ai-models/finetune/prepare_sft.py ai-models/finetune/train_lora.py ai-models/eval/run_prompt_eval.py
          python -m unittest discover -s ai-models/finetune/tests -v
          python ai-models/eval/run_prompt_eval.py --validate-only
      - name: Build Android APK including llama.cpp JNI runtime
        run: gradle --no-daemon assembleDebug
      - name: Verify APK includes native arm64 runtime
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E 'lib/arm64-v8a/libneetllm.so'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E 'classes.dex'
      - uses: actions/upload-artifact@v4
        with:
          name: NEET-IQ-AI-3.0-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
